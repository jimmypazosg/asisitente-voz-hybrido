[project]
name = "biktus-asistente-voz"
version = "0.1.0"
description = "Asistente de voz local, privado e híbrido para Windows 11 con Faster-Whisper, Ollama, Gemini, Kokoro TTS y HUD interactivo."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jimmy Pazos" }
]
license = { text = "MIT" }
keywords = [
    "voice-assistant",
    "whisper",
    "faster-whisper",
    "ollama",
    "gemini",
    "kokoro-tts",
    "cuda",
    "rtx-4060",
    "speech-to-text",
    "text-to-speech",
    "windows11"
]
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "pynput>=1.8.2",
    "pyttsx3>=2.99",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "sounddevice>=0.5.6",
    "kokoro-onnx>=0.6.1",
    "soundfile>=0.14.0",
    "google-genai>=2.31.0",
]

[project.scripts]
asistente-voz = "asistente_voz:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
